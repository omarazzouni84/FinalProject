<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #2e8b57;
      color: white;
      text-align: center;
      padding: 15px;
    }
    main {
      flex: 1; 
      display: flex;
      justify-content: center; 
      align-items: center;    
    }
    .login-box {
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }
    input, button {
      width: 80%;
      margin: 8px auto;
      padding: 8px;
    }
    button {
      background: #2e8b57;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #246b45;
    }
    footer {
      text-align: center;
      padding: 10px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>mypharmacy</h1>
  </header>

  <main>
    <div class="login-box">
      <h2>Login</h2>
      <form>
        <input type="text" placeholder="Username"><br><br>
        <input type="password" placeholder="Password"><br><br>
        <button type="submit">Login</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 mypharmacy</p>
  </footer>
</body>
</html>
